services:
  workbench:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/workspaces/silentorb-workbench:cached
      - ${TOME_REPO:-../../tome}:/workspaces/tome:cached
      - ${MARLOTH_REPO:-../../marloth-story}:/workspaces/marloth-story:cached
      - ${SILENTORB_WEB_REPO:-../../silentorb-web}:/workspaces/silentorb-web:cached
      - tome-node-modules:/workspaces/tome/node_modules
      # OpenCode agent config/state, shared with the WSL host so it persists across rebuilds.
      # Create these host dirs before rebuilding to avoid root-owned auto-created mounts.
      - ${OPENCODE_CONFIG_DIR:-${HOME}/.config/opencode}:/home/vscode/.config/opencode
      - ${OPENCODE_DATA_DIR:-${HOME}/.local/share/opencode}:/home/vscode/.local/share/opencode
    ulimits:
      core: 0
    # Lets Cursor's agent command sandbox (Landlock/Bubblewrap) initialize.
    # Docker's default seccomp profile blocks unshare(CLONE_NEWUSER) without
    # CAP_SYS_ADMIN, which fails on this WSL2 host (EPERM) and breaks the shell.
    security_opt:
      - seccomp:unconfined
    user: vscode
    extra_hosts:
      - "host.docker.internal:host-gateway"

  ollama-bridge:
    image: nginx:alpine
    profiles: ["ollama"]
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./ollama-bridge/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    environment:
      OLLAMA_BRIDGE_PORT: "${OLLAMA_BRIDGE_PORT:-11435}"
      OLLAMA_HOST_PORT: "${OLLAMA_HOST_PORT:-11434}"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://127.0.0.1:$${OLLAMA_BRIDGE_PORT:-11435}/api/tags || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  tome:
    build:
      context: ${TOME_REPO:-../../tome}
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ${TOME_REPO:-../../tome}:/workspaces/tome:cached
      - ${MARLOTH_REPO:-../../marloth-story}:/workspaces/marloth-story:cached
      - tome-node-modules:/workspaces/tome/node_modules
    environment:
      TOME_CONTENT_PATH: /workspaces/marloth-story/content
      TOME_DB_PATH: /workspaces/marloth-story/data/tome.sqlite
      TOME_EDITOR_DEV_HOST: "0.0.0.0"
    ulimits:
      core: 0
    user: vscode
    working_dir: /workspaces/tome
    command: ["/bin/bash", "scripts/dev-start.sh"]
    ports:
      - "3847:3847"
      - "5173:5173"

volumes:
  tome-node-modules:
