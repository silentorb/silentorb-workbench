# Match Dev Containers' project name so host scripts (e.g. scripts/tome.sh) and
# the IDE share one stack (volumes, networks, tome/workbench containers).
name: silentorb-workbench_devcontainer

x-workbench-volumes: &workbench-volumes
  - ..:/workspaces/silentorb-workbench:cached
  - ${TOME_REPO:-../../tome}:${MNT:-/workspaces/silentorb-workbench/.mnt}/tome:cached
  - ${MARLOTH_REPO:-../../marloth-story}:${MNT:-/workspaces/silentorb-workbench/.mnt}/marloth-story:cached
  - ${TRANSLUCENCE_REPO:-../../translucence}:${MNT:-/workspaces/silentorb-workbench/.mnt}/translucence:cached
  - ${SILENTORB_WEB_REPO:-../../silentorb-web}:${MNT:-/workspaces/silentorb-workbench/.mnt}/silentorb-web:cached
  - ${IMP_REPO:-../../imp-ts}:${MNT:-/workspaces/silentorb-workbench/.mnt}/imp-ts:cached
  - ${IMP_RUST_REPO:-../../imp-rust}:${MNT:-/workspaces/silentorb-workbench/.mnt}/imp-rust:cached
  - ${IMP_SPEC_REPO:-../../imp-spec}:${MNT:-/workspaces/silentorb-workbench/.mnt}/imp-spec:cached
  - tome-node-modules:${MNT:-/workspaces/silentorb-workbench/.mnt}/tome/node_modules
  - ${OPENCODE_CONFIG_DIR:-${HOME}/.config/opencode}:/home/vscode/.config/opencode
  - ${OPENCODE_DATA_DIR:-${HOME}/.local/share/opencode}:/home/vscode/.local/share/opencode

x-tome-volumes: &tome-volumes
  - ${TOME_REPO:-../../tome}:${MNT:-/workspaces/silentorb-workbench/.mnt}/tome:cached
  - ${MARLOTH_REPO:-../../marloth-story}:${MNT:-/workspaces/silentorb-workbench/.mnt}/marloth-story:cached
  - ${TRANSLUCENCE_REPO:-../../translucence}:${MNT:-/workspaces/silentorb-workbench/.mnt}/translucence:cached
  - ${SILENTORB_WEB_REPO:-../../silentorb-web}:${MNT:-/workspaces/silentorb-workbench/.mnt}/silentorb-web:cached
  - ${IMP_REPO:-../../imp-ts}:${MNT:-/workspaces/silentorb-workbench/.mnt}/imp-ts:cached
  - tome-node-modules:${MNT:-/workspaces/silentorb-workbench/.mnt}/tome/node_modules

services:
  workbench:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes: *workbench-volumes
    ulimits:
      core: 0
    # Lets Cursor's agent command sandbox (Landlock/Bubblewrap) initialize.
    # Docker's default seccomp profile blocks unshare(CLONE_NEWUSER) without
    # CAP_SYS_ADMIN, which fails on this WSL2 host (EPERM) and breaks the shell.
    security_opt:
      - seccomp:unconfined
    user: vscode
    extra_hosts:
      - "host.docker.internal:host-gateway"

  ollama-bridge:
    image: nginx:alpine
    profiles: ["ollama"]
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./ollama-bridge/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    environment:
      OLLAMA_BRIDGE_PORT: "${OLLAMA_BRIDGE_PORT:-11435}"
      OLLAMA_HOST_PORT: "${OLLAMA_HOST_PORT:-11434}"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://127.0.0.1:$${OLLAMA_BRIDGE_PORT:-11435}/api/tags || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  tome:
    build:
      context: ${TOME_REPO:-../../tome}
      dockerfile: docker/Dockerfile.dev
    volumes: *tome-volumes
    environment:
      # Default: solo Marloth corpus via package tome-server.json (legacy store+cache).
      # Normalize auto-injects an FTS dataStore so typed search / @ mentions work.
      # Multi-corpus: set TOME_CORPORA (+ dedicated TOME_DB_PATH). Do not point
      # TOME_SERVER_CONFIG at a solo-only dataStores file or corpora env is ignored.
      # Optional explicit config (must be on a tome-mounted path), e.g.:
      # TOME_SERVER_CONFIG=/workspaces/silentorb-workbench/.mnt/tome/packages/tome-server/config/tome-server.workbench.json
      TOME_CONTENT_PATH: ${TOME_CONTENT_PATH:-/workspaces/silentorb-workbench/.mnt/marloth-story/content}
      TOME_DB_PATH: ${TOME_DB_PATH:-/workspaces/silentorb-workbench/.mnt/marloth-story/data/tome.sqlite}
      TOME_SERVER_CONFIG: ${TOME_SERVER_CONFIG:-}
      TOME_CORPORA: ${TOME_CORPORA:-}
      TOME_EDITOR_DEV_HOST: "0.0.0.0"
      TOME_PROFILING: ${TOME_PROFILING:-}
      TOME_PROFILING_SLOW_MS: ${TOME_PROFILING_SLOW_MS:-}
      TOME_PROFILING_DB_PATH: ${TOME_PROFILING_DB_PATH:-}
      TOME_PROFILING_LOG: ${TOME_PROFILING_LOG:-}
      TOME_PROFILING_MAX_MB: ${TOME_PROFILING_MAX_MB:-}
      TOME_PROFILING_BATCH_DELETE_MB: ${TOME_PROFILING_BATCH_DELETE_MB:-}
      IMP_ROOT: ${IMP_ROOT:-/workspaces/silentorb-workbench/.mnt/imp-ts}
    ulimits:
      core: 0
    user: vscode
    working_dir: /workspaces/silentorb-workbench/.mnt/tome
    command: ["/bin/bash", "scripts/dev-start.sh"]
    ports:
      - "3847:3847"
      - "5173:5173"

  imp-rust:
    profiles: ["imp-rust"]
    build:
      context: ${IMP_RUST_HOST_REPO:-${IMP_RUST_REPO:-../../imp-rust}}
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ${IMP_RUST_HOST_REPO:-${IMP_RUST_REPO:-../../imp-rust}}:/workspace:cached
    working_dir: /workspace
    user: root

volumes:
  tome-node-modules:
